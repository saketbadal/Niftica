# cloudbuild.yaml
# CI/CD pipeline configuration
steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/Niftica', '.']
  
  # Push to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/Niftica']
  
  # Deploy to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'Niftica'
      - '--image'
      - 'gcr.io/$PROJECT_ID/Niftica'
      - '--region'
      - 'asia-south1'
      - '--platform'
      - 'managed'
      - '--memory'
      - '2Gi'

# Timeout for the entire build
timeout: '1200s'